# PratiBimb issue/PR label taxonomy.
# Apply with: bash scripts/sync-labels.sh
# Every issue gets one area:, one type:, one priority:.
# status: is optional and reflects reality, not aspiration.
# verdict: is applied to spike PRs only.

- name: "area:client"
  color: "1f6feb"
  description: "Browser extension, MV3, UI"
- name: "area:server"
  color: "1f6feb"
  description: "FastAPI, vLLM, action planning"
- name: "area:perception"
  color: "8250df"
  description: "Capture, DOM graph, detectors, fusion"
- name: "area:security"
  color: "d1242f"
  description: "Egress, invariants, threat model"
- name: "area:privacy"
  color: "d1242f"
  description: "Redaction, vault, manifest, re-hydration"
- name: "area:inference"
  color: "8250df"
  description: "ONNX Runtime Web, WebGPU/WASM, models"
- name: "area:verification"
  color: "d1242f"
  description: "Differential verifier, value-aware check"
- name: "area:testing"
  color: "0969da"
  description: "Test suites, fixtures, benchmark harness"
- name: "area:performance"
  color: "bf8700"
  description: "Latency, heap, GPU memory, cache"
- name: "area:docs"
  color: "6e7781"
  description: "Documentation, ADRs, dossier"
- name: "type:feature"
  color: "0e8a16"
  description: "New capability that ships"
- name: "type:bug"
  color: "d1242f"
  description: "Incorrect behaviour"
- name: "type:spike"
  color: "fbca04"
  description: "Resolve an UNKNOWN with evidence"
- name: "type:security"
  color: "b60205"
  description: "Trust-boundary or licence concern"
- name: "type:research"
  color: "fbca04"
  description: "Investigation without a build target"
- name: "type:refactor"
  color: "6e7781"
  description: "Behaviour-preserving restructure"
- name: "priority:p0"
  color: "b60205"
  description: "Blocking. Drop other work."
- name: "priority:p1"
  color: "d93f0b"
  description: "Required for the next milestone"
- name: "priority:p2"
  color: "fbca04"
  description: "Planned"
- name: "priority:p3"
  color: "c5def5"
  description: "Nice to have"
- name: "status:blocked"
  color: "d1242f"
  description: "Waiting on an UNKNOWN or a decision"
- name: "status:experimental"
  color: "fbca04"
  description: "Spike in progress; not product code"
- name: "status:ready"
  color: "0e8a16"
  description: "Specified and unblocked"
- name: "status:in-progress"
  color: "1f6feb"
  description: "Actively being worked"
- name: "verdict:accept"
  color: "0e8a16"
  description: "Capability confirmed in the target context"
- name: "verdict:reject"
  color: "b60205"
  description: "Does not work; evidence preserved"
- name: "verdict:conditional"
  color: "fbca04"
  description: "Works under stated constraints"
- name: "verdict:inconclusive"
  color: "6e7781"
  description: "Did not answer the question"
